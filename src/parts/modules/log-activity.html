                <!-- MODULE: LOG ACTIVITY -->
                <div id="modLogActivity" class="module-section hidden">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-100 pb-4 mb-6 gap-4">
                            <div><h2 class="text-xl font-bold text-gray-800"><i class="fas fa-history text-indigo-600 mr-2"></i>Log Aktivitas Sistem</h2><p class="text-sm text-gray-500 mt-1">Riwayat aktivitas pengguna sesuai scope hierarki Anda.</p></div>
                            <button onclick="fetchLogActivity()" class="bg-white border border-gray-300 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300 text-sm font-bold py-2 px-4 rounded-lg shadow-sm transition flex items-center"><i class="fas fa-sync-alt mr-2"></i> Refresh Log</button>
                        </div>
                        <div class="flex flex-col md:flex-row gap-3 mb-5">
                            <div class="relative flex-1"><i class="fas fa-calendar-alt absolute left-3 top-3 text-gray-400 text-sm"></i><input type="date" id="logFilterDate" onchange="applyLogFilter()" class="w-full pl-9 pr-4 py-2.5 border border-gray-300 rounded-xl text-sm bg-white shadow-sm"></div>
                            <div class="relative flex-1"><i class="fas fa-user absolute left-3 top-3 text-gray-400 text-sm"></i><input type="text" id="logFilterUser" oninput="debounceSearch(applyLogFilter)" placeholder="Filter User ID..." class="w-full pl-9 pr-4 py-2.5 border border-gray-300 rounded-xl text-sm bg-white shadow-sm"></div>
                            <div class="relative flex-1"><i class="fas fa-filter absolute left-3 top-3 text-gray-400 text-sm"></i><input type="text" id="logFilterJenis" oninput="debounceSearch(applyLogFilter)" placeholder="Ketik kata kunci aktivitas..." class="w-full pl-9 pr-4 py-2.5 border border-gray-300 rounded-xl text-sm bg-white shadow-sm"></div>
                        </div>
                        <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden mb-4">
                            <div class="table-container" style="max-height:460px">
                                <table class="w-full text-left border-collapse">
                                    <thead class="bg-gray-50 border-b border-gray-200 sticky top-0">
                                        <tr><th class="p-3 text-[10px] font-black text-gray-500 uppercase tracking-wider w-40">Timestamp</th><th class="p-3 text-[10px] font-black text-gray-500 uppercase tracking-wider">User ID</th><th class="p-3 text-[10px] font-black text-gray-500 uppercase tracking-wider">Role</th><th class="p-3 text-[10px] font-black text-gray-500 uppercase tracking-wider">Keterangan / Aktivitas</th>
                                    <th class="p-3 text-left">Modul / Tab</th><th class="p-3 text-left">Stage</th><th class="p-3 text-left">No Batch</th></tr></thead>
                                    <tbody id="logTableBody" class="divide-y divide-gray-100 text-sm"><tr><td colspan="7" class="p-8 text-center text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data log...</td></tr></tbody>
                                </table>
                            </div>
                        </div>
                        <div id="logPagination"></div>
                    </div>
                </div>
