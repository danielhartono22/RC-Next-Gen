        <!-- ====================================================================
             GAYA BERSAMA - dipakai aplikasi DAN dashboard publik
             ====================================================================
             Seluruh blok gaya tinggal di satu berkas karena panel Report dipasang di dua
             halaman. Aturan seperti .rc-kpi-value, .rc-expand-body dan th.rc-sort menentukan
             tinggi kanvas, pemendekan angka pada kartu dan panah pengurutan; bila hanya salah
             satu halaman memilikinya, keduanya berhenti terlihat sama meski datanya sama.

             Beberapa aturan di sini hanya terpakai portal. Itu dibiarkan: menyaringnya berarti
             menebak-nebak mana yang kelak dibutuhkan panel bersama, dan tebakan itulah yang
             menghasilkan selisih tampilan yang sulit dilacak. -->
        <style>
            .loader { border: 4px solid #f3f3f3; border-top: 4px solid #dc4426; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            .table-container { max-height: 500px; overflow-y: auto; overflow-x: auto; position: relative; }
            .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
            .table-container::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 4px; }
            .table-container thead th { position: sticky; top: 0; z-index: 10; background-color: #f8fafc; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
            .excel-table th, .excel-table td { padding: 0.5rem 0.75rem; border-color: #e2e8f0; border-width: 1px; }
            .excel-table th { background-color: #f1f5f9; font-weight: 800; color: #475569; text-transform: uppercase; font-size: 10px; white-space: nowrap; }
            .excel-input { width: 100%; border: none; outline: none; background: transparent; padding: 4px 6px; min-width: 90px; font-size: 11px; }
            .excel-input:focus { background-color: #e0f2fe; border-radius: 4px; }
            .multiselect-dropdown { display: none; position: absolute; z-index: 60; width: 100%; max-height: 250px; overflow-y: auto; background: white; border: 1px solid #d1d5db; border-radius: 0.5rem; margin-top: 4px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
            .multiselect-dropdown.show { display: block; }
            /* Bilah filter sebelumnya memakai z-10. Nilai itu membentuk stacking context
               tersendiri, sehingga z-index milik dropdown terkurung di dalamnya dan kalah oleh
               kartu yang datang sesudahnya - itulah sebabnya daftar Campaign dan Tahun Campaign
               tertimpa gambar. Bilah filter kini berada di lapisan yang lebih tinggi, dan isi di
               bawahnya dikembalikan ke lapisan dasar supaya tidak ikut bersaing. */
            .rc-filter-bar { position: relative; z-index: 40; }
            .rc-below-filter { position: relative; z-index: 0; }

            /* Kartu yang diperbesar menempati JENDELA, bukan kotak berukuran tetap. Versi
               sebelumnya memakai min(96vw,1400px) x min(92vh,900px); batas piksel itu membuat
               kartu berhenti membesar pada layar lebar, sehingga "perbesar" terasa tidak
               melakukan apa-apa. Sekarang hanya menyisakan margin tipis. */
            #rcExpandBackdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55);
                backdrop-filter: blur(2px); z-index: 65; }
            .rc-card-expanded {
                position: fixed; inset: 12px; z-index: 70;
                width: auto; height: auto; max-width: none; max-height: none;
                overflow: auto; background: #fff; border-radius: 1rem; padding: 1.25rem;
                box-shadow: 0 25px 50px -12px rgba(0,0,0,.45);
                display: flex; flex-direction: column;
            }
            .rc-card-expanded > .rc-expand-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
            .rc-card-expanded canvas { max-height: none !important; }
            .rc-card-expanded table { font-size: 0.9rem; }
            body.rc-has-expanded { overflow: hidden; }

            /* Selama ada modal terbuka, halaman di belakangnya tidak boleh ikut tergulir.
               Tanpa ini, menggulir di atas modal justru menggerakkan daftar di belakangnya dan
               posisi baca pengguna hilang begitu modal ditutup. */
            /* Halaman di belakang modal benar-benar berhenti, bukan sekadar tampak berhenti.
               Dikunci pada <html> DAN <body>: mana yang menjadi elemen penggulir berbeda-beda
               menurut peramban dan gaya yang sedang berlaku, dan mengunci salah satunya saja
               menyisakan kemungkinan halaman tetap bergerak. */
            html.rc-modal-terbuka, body.rc-modal-terbuka { overflow: hidden; }

            /* inert menahan klik, Tab, fokus dan pembaca layar - tetapi TIDAK menahan roda
               tetikus. Tanpa baris di bawah, tabel di belakang modal yang punya penggulir
               sendiri (.table-container) masih ikut bergerak ketika digulir, dan itulah yang
               dilaporkan pemilik: "layar dibelakang masih aktif dan bisa digerakkan".
               pointer-events:none membuat roda tetikus tidak lagi menyasar isi itu, sehingga
               gulirannya jatuh ke viewport yang sudah dikunci di atas. */
            body.rc-modal-terbuka > [inert] { pointer-events: none; }

            /* Modal yang isinya lebih tinggi dari layar harus dapat digulir sampai habis.
               Sebelumnya lapisannya memakai align-items:center; ketika isinya melebihi tinggi
               layar, flexbox memusatkannya sehingga bagian ATAS terpotong dan tidak dapat
               dicapai dengan menggulir - tombol yang berada di sana menjadi mustahil ditekan.
               Penyelesaiannya bukan mematikan pemusatan, melainkan memindahkannya ke margin
               otomatis pada anaknya: isi yang pendek tetap terlihat di tengah, isi yang panjang
               mengalir dan dapat digulir dari ujung ke ujung. */
            body > [id$="Modal"] { overflow-y: auto; align-items: flex-start; }
            body > [id$="Modal"] > * { margin-top: auto; margin-bottom: auto; }

            /* Elemen yang dimatikan tidak boleh terlihat masih bisa dipakai. */
            [inert] { cursor: default; }

            /* Angka nominal panjang tidak boleh melewati kartunya. Dipendekkan otomatis oleh
               rcNominalRingkas() di JavaScript, dan di sini dijaga agar tetap muat walau bahasanya
               berubah atau angkanya lebih panjang dari dugaan. */
            .rc-kpi-value { font-size: clamp(0.95rem, 1.6vw, 1.35rem); line-height: 1.15;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .rc-kpi-money { font-size: clamp(0.9rem, 1.4vw, 1.15rem);
                white-space: normal; overflow-wrap: anywhere; text-overflow: clip; }
            .rc-kpi-sub { font-size: 0.68rem; color: #6b7280; margin-top: 2px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

            /* Batas tinggi kanvas ketika BUKAN sedang diperbesar. Tanpa batas ini, kanvas
               yang baru kembali dari modal mempertahankan tinggi modalnya dan kartunya
               menjadi raksasa. Di dalam modal batas ini dicabut oleh .rc-card-expanded. */
            .rc-expand-body { position: relative; min-width: 0; }
            .rc-expand-body > canvas { max-height: 320px; }
            /* Chart Timetable mendapat batas yang pasti sejak render pertama. Sebelumnya tinggi
               hanya berasal dari atribut canvas; Chart.js sempat membaca wadah yang terlalu
               kecil lalu baru benar setelah tombol Perbesar memicu resize. */
            .rc-chart-body { width: 100%; height: clamp(240px, 24vw, 300px); min-height: 240px; }
            .rc-chart-body > canvas { width: 100% !important; height: 100% !important; max-height: none; }

            /* Isi dialog Perbesar selalu memakai ruang panel yang tersedia. Kelas pembatas
               seperti max-h-[460px] tetap berguna pada card biasa, tetapi tidak boleh membatasi
               isi setelah dipindahkan ke dialog. */
            #cardExpandBody { min-width: 0; min-height: 0; }
            #cardExpandBody > .rc-expanded-content {
                width: 100% !important; height: 100% !important; min-width: 0; min-height: 0;
                max-width: none !important; max-height: none !important; overflow: auto;
            }
            #cardExpandBody > .rc-expanded-chart {
                display: flex; flex-direction: column; overflow: hidden;
            }
            #cardExpandBody .rc-expanded-chart canvas {
                width: 100% !important; height: 100% !important; max-height: none !important;
            }

            /* Dialog teks tetap ringkas. Begitu isinya tabel atau grafik, rcDialog menambahkan
               rc-dialog-wide agar lebar panel mengikuti kebutuhan isi, tetapi tetap tidak
               melewati viewport. */
            #rcDialogModal > .rc-dialog-panel {
                width: min(48rem, calc(100vw - 2rem)); max-width: calc(100vw - 2rem);
            }
            #rcDialogModal.rc-dialog-wide > .rc-dialog-panel {
                width: min(76rem, calc(100vw - 2rem));
            }
            @media (max-width: 640px) {
                .rc-chart-body { height: 260px; min-height: 260px; }
                #rcDialogModal > .rc-dialog-panel,
                #rcDialogModal.rc-dialog-wide > .rc-dialog-panel {
                    width: calc(100vw - 1rem); max-width: calc(100vw - 1rem);
                }
            }

            /* Teks panjang di dalam tabel data DIBUNGKUS, bukan dipotong.
               Pemilik meminta: "untuk data table yang karakternya tidak cukup sesuaikan dengan
               wraptext secara rapih". Sebelumnya nama toko dan nama campaign yang panjang
               dipotong dengan elipsis - isinya hanya dapat dibaca dengan menyorot selnya satu
               per satu, dan pada cetakan maupun tangkapan layar hilang sama sekali.

               Batas lebarnya (max-w-[220px] dan sejenisnya) sengaja DIBIARKAN: ia tetap menjaga
               kolom tidak melebar, sementara isinya kini mengalir ke bawah di dalam batas itu.
               overflow-wrap:anywhere dipakai agar kode panjang tanpa spasi - nomor dokumen,
               kode campaign - ikut terpotong rapi alih-alih mendorong kolom melebar. */
            table td .truncate, table td.truncate,
            table th .truncate, table th.truncate {
                overflow: visible;
                text-overflow: clip;
                white-space: normal;
                overflow-wrap: anywhere;
            }
            /* Sel tabel diberi jarak baris yang sedikit lebih rapat ketika isinya melipat,
               supaya baris yang terdiri dari dua baris teks tetap terlihat sebagai satu baris
               data - bukan seperti dua baris terpisah. */
            table td { line-height: 1.35; }

            /* Header tabel yang dapat diurutkan. */
            th.rc-sort { cursor: pointer; user-select: none; white-space: nowrap; }
            th.rc-sort:hover { background: #eef2ff; }
            th.rc-sort .rc-arrow { opacity: .35; margin-left: 4px; font-size: .7em; }
            th.rc-sort.rc-asc .rc-arrow, th.rc-sort.rc-desc .rc-arrow { opacity: 1; color: #2563eb; }

            .scrollbar-hide::-webkit-scrollbar { display: none; }
            .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
            .expanded-details { background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; }

            /* Teks yang sering berubah - jam sesi, indikator muat bertahap - ditampilkan dari
               atribut data-teks, bukan dari isi elemen. Tailwind versi CDN memindai SEMUA elemen
               berkelas di dokumen setiap kali isi elemen mana pun berubah; pada tabel puluhan
               ribu baris satu pemindaian memakan detik, dan jam yang berubah tiap detik membuat
               browser sibuk terus. Perubahan atribut selain class tidak memicunya. */
            .rc-teks-atribut::after { content: attr(data-teks); }
        </style>
