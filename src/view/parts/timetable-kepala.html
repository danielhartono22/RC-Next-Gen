<!-- Kepala modul Timetable (judul, Muat Ulang, Excel, tab): potongan BERSAMA portal dan halaman publik
     /details-campaign (27 Oktober 2026). Halaman publik menyembunyikan tab Report. -->
<div class="flex justify-between items-center border-b border-gray-100 pb-4 mb-5">
    <div>
        <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-table-cells text-amber-600 mr-2"></i>Timetable</h2>
        <p class="text-xs text-gray-500 mt-1" id="ttRingkas">-</p>
    </div>
    <div class="flex gap-2">
        <button onclick="ttMuatUlang()" class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 text-sm font-bold py-2 px-4 rounded-lg shadow-sm"><i class="fas fa-sync mr-1.5"></i> Muat Ulang</button>
        <button onclick="ttUnduhExcel()" class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 text-sm font-bold py-2 px-4 rounded-lg shadow-sm"><i class="fas fa-file-excel mr-1.5 text-green-600"></i> Excel</button>
    </div>
</div>

<!-- Tab (20261163200000): "Report" adalah isi Timetable yang sudah ada; "Details Campaign" baru. -->
<div class="flex gap-2 p-1 bg-gray-50 rounded-xl mb-5">
    <button id="ttTabReport" onclick="switchTimetableTab('matrix')" class="px-5 py-2 text-sm font-bold rounded-lg bg-amber-100 text-amber-700">Report</button>
    <button id="ttTabCampaign" onclick="switchTimetableTab('campaign')" class="px-5 py-2 text-sm font-bold rounded-lg text-gray-500 hover:bg-gray-100">Details Campaign</button>
</div>
