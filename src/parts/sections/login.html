            <!-- LOGIN SECTION -->
            <div id="loginSection" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 mt-10">
                <div class="text-center mb-6">
                    <div class="mx-auto mb-4 flex justify-center items-center w-32 h-32">
                        <img src="images/blobby.png" alt="Resource Collection"
                             class="h-32 w-32 object-contain drop-shadow-md"
                             onerror="this.onerror=null; this.src='images/logo.png';">
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">Login Portal</h2>
                    <p class="text-gray-500 text-sm mt-1">Resource Collection</p>
                </div>
                <div id="loginError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm font-bold shadow-sm"><span id="loginErrorText">-</span></div>

                <div class="space-y-4" id="loginFormArea">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">User ID</label><input type="text" id="userid" onkeypress="handleLoginEnter(event)" class="w-full px-4 py-3 border rounded-lg focus:ring-red-500 focus:border-red-500 bg-gray-50 focus:bg-white transition-all disabled:opacity-50 disabled:bg-gray-200" placeholder="Masukkan ID Anda"></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">PIN Rahasia</label><input type="password" id="pin" onkeypress="handleLoginEnter(event)" class="w-full px-4 py-3 border rounded-lg focus:ring-red-500 focus:border-red-500 bg-gray-50 focus:bg-white transition-all disabled:opacity-50 disabled:bg-gray-200" placeholder="••••"></div>
                    <button id="btnLogin" onclick="processLogin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-4 rounded-lg flex justify-center items-center mt-6 transition duration-200 shadow-md disabled:bg-red-400"><span id="btnLoginText">Masuk ke Portal</span><div id="loginLoader" class="loader hidden ml-2 border-t-white w-5 h-5 border-2"></div></button>
                    <p class="text-center text-sm text-gray-500 mt-3"><button type="button" onclick="openForgotPinModal()" class="font-bold text-gray-600 hover:text-red-600 hover:underline">Lupa PIN?</button></p>
                    <p class="text-center text-sm text-gray-500 mt-2">Belum punya akun? <button type="button" onclick="openSignupModal()" class="font-bold text-red-600 hover:text-red-700 hover:underline">Daftar di sini</button></p>
                </div>
            </div>
